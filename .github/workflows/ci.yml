name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile Code Base
        run: mvn -B clean compile

      - name: Run Automated Test Suites
        run: mvn -B test

      - name: Package Executable Distribution
        run: mvn -B package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-ready-jar
          path: target/*.jar
          retention-days: 5

  deploy-production:
    name: Deploy to Production
    needs: build-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-ready-jar
          path: production-package

      - name: Verify Production Package
        run: |
          echo "CI tests passed."
          echo "Preparing the production package..."
          find production-package -maxdepth 2 -type f -name '*.jar' -print
          test -n "$(find production-package -type f -name '*.jar' -print -quit)"
          echo "Production package verified."
          echo "Automatic deployment pipeline completed."
